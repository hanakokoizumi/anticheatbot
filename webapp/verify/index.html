<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>入群验证</title>
  <link rel="stylesheet" href="/shared/ui.css?v=10" />
  <!-- 必须早于 telegram-web-app.js：官方脚本可能在初始化时 replaceState 去掉 ?tgWebAppStartParam= / ?t= -->
  <script>
    (function () {
      try {
        var s = new URLSearchParams(window.location.search);
        var t = s.get('t') || s.get('tgWebAppStartParam');
        if (!t && window.location.hash && window.location.hash.length > 1) {
          var h = new URLSearchParams(window.location.hash.replace(/^#/, ''));
          t = h.get('tgWebAppStartParam') || h.get('t');
        }
        t = t ? String(t).trim() : '';
        if (t) {
          window.__hnkVerifyLaunchToken = t;
          sessionStorage.setItem('hnk_verify_t', t);
        } else if (
          window.performance &&
          performance.getEntriesByType &&
          performance.getEntriesByType('navigation')[0] &&
          performance.getEntriesByType('navigation')[0].type === 'reload'
        ) {
          // Only reload may recover a URL token removed by the Telegram SDK.
          // A fresh launch without a token must still open the admin entry.
          window.__hnkVerifyReload = true;
        } else {
          sessionStorage.removeItem('hnk_verify_t');
        }
      } catch (e) {}
    })();
  </script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script id="turnstileApi" src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
  <!-- 同源托管，避免 Telegram WebView 拦截第三方 CDN 导致 Markdown 无法渲染 -->
  <script src="/shared/vendor/purify.min.js?v=3.4.16"></script>
  <script src="/shared/vendor/marked.min.js"></script>
</head>
<body>
  <div class="shell">
    <div id="status" class="status-line" role="status" aria-live="polite"></div>
    <div id="app" style="display:none">
      <header class="topbar">
        <h1>入群验证</h1>
        <p class="sub">请完成以下步骤，通过后即可在群内发言。</p>
      </header>
      <div id="main"></div>
      <div id="turnstile"></div>
      <button id="retryTurnstile" type="button" class="btn btn--secondary hidden"></button>
    </div>
  </div>
  <script src="/shared/i18n.js?v=20"></script>
  <script src="/verify/verify.js?v=16"></script>
</body>
</html>

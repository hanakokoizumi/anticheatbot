<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title data-skip-admin-doc-title>管理后台</title>
  <link rel="stylesheet" href="/shared/ui.css?v=10" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="toast" class="toast" style="display:none" aria-live="polite"></div>
  <div class="shell shell--wide">
    <p id="status" class="status-line" role="status" aria-live="polite" data-i18n="statusLoading">加载中…</p>
    <button id="retryLoad" type="button" class="btn btn--secondary hidden" data-i18n="reload">重新加载</button>
    <div id="panel" class="hidden">
      <div class="admin-sticky-head">
        <header class="topbar">
          <h1 style="margin:0">
            <span id="homePageTitle" data-i18n="pageTitleHome">管理后台</span>
            <span id="gab" class="badge badge--accent hidden" data-i18n="badgeGlobal">全局</span>
          </h1>
          <p id="homePageSubtitle" class="sub" data-i18n="homeSubtitle" style="margin:0.35rem 0 0">点选下方群组进入该群的设置与题库。</p>
          <div
            id="homeChatTabsWrap"
            class="admin-home-tabs hidden"
            role="tablist"
            data-i18n-aria="ariaHomeChatTabs"
          >
            <button type="button" class="admin-tab admin-tab--active" id="homeTabMine" role="tab" aria-selected="true" data-i18n="tabHomeMyChats">
              本人群组
            </button>
            <button type="button" class="admin-tab" id="homeTabGlobal" role="tab" aria-selected="false" data-i18n="tabHomeGlobalChats">
              全局群组
            </button>
          </div>
        </header>
      </div>

      <div class="card" style="padding:0.75rem 1rem;margin-bottom:0.75rem">
        <div class="lang-bar" style="margin:0">
          <span class="sub" data-i18n="langLabel">界面语言</span>
          <select id="adminUiLocale" aria-label="locale">
            <option value="zh-Hans" data-i18n="langOptZh">简体中文</option>
            <option value="en" data-i18n="langOptEn">English</option>
            <option value="ja" data-i18n="langOptJa">日本語</option>
            <option value="ko" data-i18n="langOptKo">한국어</option>
          </select>
        </div>
      </div>

      <div class="card">
        <h2 id="homeSectionChats" class="section-title" data-i18n="sectionHomeChats">群组</h2>
        <div id="chats" class="chat-list"></div>
      </div>
    </div>
  </div>
  <script src="/shared/i18n.js?v=20"></script>
  <script src="/admin/admin-home.js?v=4"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title data-skip-admin-doc-title>编辑题目</title>
  <link rel="stylesheet" href="/shared/ui.css?v=9" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="toast" class="toast" style="display:none" aria-live="polite"></div>
  <div class="shell shell--wide">
    <div class="admin-sticky-head">
      <header class="topbar topbar--nav">
        <a
          class="topbar-back"
          id="linkBackAdmin"
          href="index.html"
          data-i18n-aria="btnBackToAdmin"
          aria-label="返回群管理"
          title="返回群管理"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 18l-6-6 6-6" />
          </svg>
        </a>
        <h1 class="topbar-title" id="quizEditHeading">题目</h1>
      </header>
    </div>

    <div class="quiz-edit-main-wrap">
      <div id="quizEditLoading" class="admin-busy-overlay hidden" aria-hidden="true">
        <div class="load-stack">
          <span class="load-spinner" aria-hidden="true"></span>
          <p class="load-msg" data-i18n="loadingQuizQuestion">正在加载题目…</p>
        </div>
      </div>

      <div class="card">
        <input type="hidden" id="qf_id" value="" />
        <div class="field">
          <label for="qf_prompt" data-i18n="lblQuizPrompt">题干</label>
          <textarea id="qf_prompt" rows="3"></textarea>
        </div>
        <div class="field">
          <span class="field-label" data-i18n="lblQuizChoices">选项（至少 2 个）</span>
          <p class="sub" id="hintQuizCorrectTap" style="margin:0 0 0.35rem"></p>
          <div id="qf_choices_list" class="quiz-choice-list" aria-label="choices"></div>
          <input type="hidden" id="qf_correct" value="0" />
          <div class="quiz-choice-add-row">
            <input type="text" id="qf_choice_add" class="quiz-choice-add" autocomplete="off" placeholder="" />
            <button
              type="button"
              id="qf_choice_add_btn"
              class="btn btn--icon btn--primary btn--sm quiz-choice-add-btn"
              data-i18n-aria="ariaQuizChoiceAdd"
              aria-label=""
              title=""
            >
              <svg class="btn-ic" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <path d="M12 5v14M5 12h14" />
              </svg>
            </button>
          </div>
        </div>
        <div class="toolbar" style="margin-top:0;flex-wrap:wrap;gap:0.5rem">
          <button type="button" class="btn btn--primary" id="qf_save" data-i18n="btnQuizSave">保存题目</button>
          <button type="button" class="btn btn--secondary" id="qf_reset" data-i18n="btnQuizReset">清空表单</button>
          <a class="btn btn--secondary" id="linkQuizImport" href="quiz-import.html" data-i18n="btnQuizJsonLlmPage">JSON / LLM</a>
        </div>
      </div>
    </div>
  </div>
  <script src="/shared/i18n.js?v=16"></script>
  <script src="/admin/admin-quiz-form.js?v=6"></script>
  <script src="/admin/quiz-edit.js?v=6"></script>
</body>
</html>

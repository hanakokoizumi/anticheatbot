services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
      POSTGRES_DB: bot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d bot"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # 覆盖 .env 中的 SQLite URL，使容器内始终连 compose 网络中的 Postgres
      DATABASE_URL: postgresql+asyncpg://bot:bot@db:5432/bot
      # 包在 site-packages 时 __file__ 不在仓库内；显式指向镜像内 webapp，避免 cwd 异常时静态资源 404
      WEBAPP_ROOT: /app/webapp
      # Docker 端口转发需要服务监听容器网卡；宿主机仍只开放 127.0.0.1
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 2808
    ports:
      - "127.0.0.1:${HTTP_PORT:-2808}:2808"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:2808/healthz', timeout=5).read()"]
      interval: 30s
      timeout: 6s
      start_period: 20s
      retries: 3

volumes:
  pgdata:
